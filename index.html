:flex;justify-content:space-between;align-items:center}.company-group>summary::-webkit-details-marker{display:none}.company-group>summary:before{content:"▸";margin-right:9px;color:#45779e}.company-group[open]>summary:before{content:"▾"}.company-title{flex:1}.company-count{font-size:12px;color:#59758d;font-weight:500}.company-people{padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px}.selection-count{font-weight:700;color:#195f9b;margin:12px 0}.company-group .check{background:#fff}.company-group .check:has(input:checked){background:#ecf5ff;border-color:#8eb9dc}.empty{padding:35px;text-align:center;color:#8393a4;border:1px dashed #d8e2ec;border-radius:11px}.notice{background:#fff8e8;border:1px solid #f0deb2;border-radius:9px;padding:12px 15px;color:#866421;font-size:12px;margin-bottom:20px}.product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.product{background:white;border:1px solid #dfe7ef;border-radius:12px;padding:20px}.product h3{margin:6px 0 10px}.product p{font-size:12px;color:#6e8092}.pill{background:#eaf4eb;color:#397548;border-radius:99px;padding:4px 8px;font-size:11px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.logout{padding:8px 12px;border:1px solid #d9e2eb;background:white;border-radius:8px;color:#48647e}.mobile-menu{display:none}@media(max-width:780px){.app{display:block}.side{width:100%;display:block}.side .logo{padding:14px 17px 3px}.side .sub{padding:0 17px 8px}.nav{display:flex;overflow:auto;padding:8px 10px}.nav button{white-space:nowrap;padding:9px 12px}.side .bottom{display:none}.top{height:auto;min-height:62px;padding:12px 17px}.content{padding:18px 14px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:12px}.stat strong{font-size:23px}.form-grid{grid-template-columns:1fr}.card{padding:16px}.heading h2{font-size:20px}}
.side-tree{padding:8px 12px 18px;overflow-y:auto}.tree-heading{font-size:11px;letter-spacing:.08em;color:#9db5c9;padding:15px 12px 8px}.tree-company{margin-bottom:5px}.tree-company>summary{cursor:pointer;list-style:none;background:#203f5a;border-radius:8px;padding:11px 10px;color:#eef5fc;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}.tree-company>summary::-webkit-details-marker{display:none}.tree-company>summary:before{content:'▸';color:#a9c4d8}.tree-company[open]>summary:before{content:'▾'}.tree-company>summary .tree-name{flex:1;overflow-wrap:anywhere}.tree-company>summary .tree-number{font-size:11px;font-weight:400;color:#b6c9d9}.tree-products{padding:5px 0 5px 14px;display:grid;gap:3px}.tree-products button{width:100%;background:transparent;border:0;border-radius:7px;padding:9px 8px;text-align:left;color:#c9d9e8;font-size:12px;overflow-wrap:anywhere}.tree-products button:before{content:'└ ';color:#91adc4}.tree-products button:hover,.tree-products button.active{background:#315c7e;color:#fff}.tree-empty{padding:10px 12px;color:#9fb5c8;font-size:12px}.case-summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.case-summary .tag{font-weight:700}@media(max-width:780px){.side-tree{padding:6px 10px 12px;max-height:260px;overflow-y:auto}.tree-heading{padding:5px 8px}.tree-company>summary{padding:8px 10px}.tree-products{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.tree-products button{padding:7px}}

.sheet-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.sheet-toolbar h3{flex:1;margin:0}.sheet-month{display:flex;align-items:center;gap:8px;font-size:13px}.sheet-month input{width:155px}.sheet-list-item{display:flex;align-items:center;gap:12px;border-top:1px solid #e5ebf2;padding:12px 0}.sheet-open{border:0;background:none;color:#195f9b;font-weight:700;text-align:left;flex:1;padding:8px}.sheet-scroll{overflow:auto;max-width:100%;border:1px solid #cbd6e2;border-radius:10px;background:white;max-height:68vh}.sheet-grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}.sheet-grid th,.sheet-grid td{border-right:1px solid #dbe2e9;border-bottom:1px solid #dbe2e9;padding:0;height:38px;background:white}.sheet-grid th{position:sticky;top:0;z-index:4;background:#eaf1f8;text-align:center;height:51px}.sheet-grid .sheet-sticky{position:sticky;z-index:2}.sheet-grid th.sheet-sticky{z-index:6}.sheet-grid .section-col{left:0;width:130px;min-width:130px;max-width:130px}.sheet-grid .item-col{left:130px;width:175px;min-width:175px;max-width:175px}.sheet-grid .date-col{min-width:90px;width:90px}.date-col small{display:block;font-weight:400;margin-top:3px}.date-col.sun{color:#cf3030}.date-col.sat{color:#2861a4}.sheet-grid .group-start td{border-top:2px solid #52697d}.sheet-grid .section-cell{background:#f7fafc;text-align:center}.sheet-grid .section-cell.no-top{border-top:0;border-bottom:0}.section-name{font-weight:700;padding:6px;overflow-wrap:anywhere}.row-label{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:5px 7px;min-height:36px}.row-label span{overflow-wrap:anywhere}.mini{font-size:11px;padding:3px 5px;border:1px solid #d7e1eb;border-radius:5px;background:#fff;color:#3a6383;cursor:pointer}.danger-text{color:#a13a3a}.formula-indicator{display:block;color:#477d9e;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 5px 4px}.sheet-input{border:0;borde </style></head><body>
<section id="loginScreen" class="login-wrap"><div class="login"><div class="brand">共有管理システム</div><div class="muted">取引先・案件情報共有 / DEMO</div><h1>ログイン</h1><form id="loginForm"><div class="field"><label for="loginCompany">会社コード</label><input id="loginCompany" required autocomplete="off" placeholder="会社コード"></div><div class="field"><label for="loginId">ログインID</label><input id="loginId" required autocomplete="username" placeholder="ログインID"></div><div class="field"><label for="loginPassword">パスワード</label><input id="loginPassword" required type="password" autocomplete="current-password" placeholder="パスワード"></div><div class="error" id="loginError" role="alert"></div><button class="btn primary full" type="submit">ログイン</button></form><div class="hint">初期管理者：会社コード・ログインID・パスワードの3か所すべてに <b>admin</b> を入力してください。<br>この試作版では架空の情報だけを使用してください。</div></div></section>
<div id="appScreen" class="app hidden"><aside class="side"><div class="logo">共有管理システム</div><div class="sub">COMPANY PORTAL / DEMO</div><nav class="nav" id="navigation"></nav><div class="side-tree" id="caseTree"></div><div class="bottom">試作版 v4 / ブラウザ内保存</div></aside><main class="main"><header class="top"><div class="account" id="accountInfo"></div><button class="logout" id="logoutBtn">ログアウト</button></header><div class="content" id="pageContent"></div></main></div>
<script>
'use strict';
// DEMO ONLY: browser-local storage and client-side checks are not authentication or access control.
const KEY='shared_management_demo_v1';
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({companies:[],cases:[]});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.companies)&&Array.isArray(d.cases)?d:initial()}catch{return initial()}}
let db=load(),user=null,page='dashboard',editCompany=null,editCase=null,selectedCaseId=null;
const expandedCompanies=new Set();
let activeSheetId=null, sheetDraft=null, sheetMonth=new Date().toISOString().slice(0,7), sheetDirty=false, formulaMode=null;
const uid=()=>globalThis.crypto?.randomUUID?.()??('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('保存できませんでした。ブラウザの保存領域を確認してください。');return false}}
function companyUsers(){return db.companies}
function getAllowedCases(){return user?.admin?db.cases:db.cases.filter(c=>(c.viewerIds||[]).includes(user?.id))}
function showApp(){ $('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('accountInfo').textContent=user.admin?'管理者 / admin':`${user.companyName} / ${user.person}（${user.loginId}）`;renderNav();renderPage() }
function renderNav(){const items=user.admin?[['dashboard','ダッシュボード'],['companies','得意先登録'],['cases','案件登録'],['mycases','案件一覧']]:[['mycases','トップ']];$('navigation').innerHTML=items.map(([id,label])=>`<button type="button" data-nav="${id}" class="${page===id?'active':''}">${label}</button>`).join('');$('navigation').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(page==='sheet'&&!askLeaveSheet())return;page=b.dataset.nav;selectedCaseId=null;activeSheetId=null;sheetDraft=null;editCompany=null;editCase=null;renderPage()}));renderCaseTree()}
function renderCaseTree(){
 const allowed=getAllowedCases();const groups=new Map();
 for(const account of db.companies){if(!groups.has(account.companyCode))groups.set(account.companyCode,{code:account.companyCode,name:account.companyName,cases:new Map()})}
 for(const c of allowed){for(const id of c.viewerIds||[]){const account=db.companies.find(a=>a.id===id);if(!account)continue;const g=groups.get(account.companyCode);if(g)g.cases.set(c.id,c)}}
 // Administrators can also see cases without an assigned viewer.
 if(user.admin){const orphan=allowed.filter(c=>!(c.viewerIds||[]).some(id=>db.companies.some(a=>a.id===id)));if(orphan.length)groups.set('__unassigned__',{code:'__unassigned__',name:'閲覧者未設定',cases:new Map(orphan.map(c=>[c.id,c]))})}
 const visible=[...groups.values()].filter(g=>g.cases.size);
 $('caseTree').innerHTML=`<div class="tree-heading">会社別の案件</div>${visible.length?visible.map(g=>`<details class="tree-company" data-company="${escapeHtml(g.code)}" ${expandedCompanies.has(g.code)?'open':''}><summary><span class="tree-name">${escapeHtml(g.name)}</span><span class="tree-number">${g.cases.size}件</span></summary><div class="tree-products">${[...g.cases.values()].map(c=>`<button type="button" data-tree-case="${escapeHtml(c.id)}" class="${page==='caseDetail'&&selectedCaseId===c.id?'active':''}" title="${escapeHtml(c.productCode)}">${escapeHtml(c.productName)}</button>`).join('')}</div></details>`).join(''):'<div class="tree-empty">表示できる案件はありません</div>'}`;
 $('caseTree').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)expandedCompanies.add(d.dataset.company);else expandedCompanies.delete(d.dataset.company)}));
 $('caseTree').querySelectorAll('[data-tree-case]').forEach(b=>b.addEventListener('click',()=>{selectedCaseId=b.dataset.treeCase;activeSheetId=null;sheetDraft=null;page='caseDetail';renderPage()}));
}
function heading(title,sub){return `<div class="heading"><div><h2>${title}</h2><p>${sub}</p></div></div>`}
function renderPage(){if(!user)return;renderNav();if(page==='dashboard'&&user.admin)return renderDashboard();if(page==='companies'&&user.admin)return renderCompanies();if(page==='cases'&&user.admin)return renderCases();if(page==='caseDetail')return renderCaseDetail();if(page==='sheet')return renderSheet();page='mycases';renderNav();renderMyCases()}
function renderDashboard(){const count=new Set(db.cases.flatMap(c=>c.viewerIds||[])).size;$('pageContent').innerHTML=heading('ダッシュボード','取引先と案件の登録状況を確認できます')+`<div class="notice">この画面は機能確認用です。ログイン情報や登録データはブラウザ内に保存され、実際のセキュリティ機能はありません。</div><div class="stats"><div class="stat"><span class="muted">登録アカウント</span><strong>${db.companies.length}</strong></div><div class="stat"><span class="muted">登録案件</span><strong>${db.cases.length}</strong></div><div class="stat"><span class="muted">案件閲覧者数</span><strong>${count}</strong></div></div><div class="card"><h3>利用の流れ</h3><p>① 得意先登録で会社とログイン情報を登録</p><p>② 案件登録で製品情報と閲覧できる担当者を選択</p><p>③ ログアウトして登録した会社コード・ログインID・パスワードでログイン</p><p class="muted">取引先アカウントでは、閲覧を許可された案件のみ表示されます。</p></div>`}
function renderCompanies(){let editing=db.companies.find(c=>c.id===editCompany);$('pageContent').innerHTML=heading('得意先登録','取引先の会社情報とログインアカウントを管理します')+`<div class="card"><h3>${editing?'登録情報の編集':'新規登録'}</h3><form id="companyForm"><div class="form-grid"><div class="field"><label>会社コード</label><input name="companyCode" required maxlength="40" value="${escapeHtml(editing?.companyCode||'')}" placeholder="例：A001"></div><div class="field"><label>会社名</label><input name="companyName" required maxlength="100" value="${escapeHtml(editing?.companyName||'')}" placeholder="例：A社"></div><div class="field"><label>担当者名</label><input name="person" required maxlength="80" value="${escapeHtml(editing?.person||'')}" placeholder="例：田中"></div><div class="field"><label>ログインID</label><input name="loginId" required maxlength="50" value="${escapeHtml(editing?.loginId||'')}" placeholder="例：tanaka"></div><div class="field"><label>パスワード（試作用）</label><input name="password" required maxlength="100" type="text" value="${escapeHtml(editing?.password||'')}" placeholder="架空のパスワード"></div></div><div class="actions">${editing?'<button class="btn secondary" type="button" id="cancelCompany">キャンセル</button>':''}<button class="btn primary" type="submit">${editing?'変更を保存':'得意先を登録'}</button></div></form></div><div class="card"><h3>登録済みアカウント（${db.companies.length}件）</h3>${db.companies.length?`<div class="table-wrap"><table><thead><tr><th>会社コード</th><th>会社名</th><th>担当者</th><th>ログインID</th><th>操作</th></tr></thead><tbody>${db.companies.map(c=>`<tr><td>${escapeHtml(c.companyCode)}</td><td>${escapeHtml(c.companyName)}</td><td>${escapeHtml(c.person)}</td><td>${escapeHtml(c.loginId)}</td><td><button class="btn secondary" data-edit-company="${c.id}">編集</button><button class="btn danger" data-delete-company="${c.id}">削除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">登録された取引先はありません</div>'}</div>`;
$('companyForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const obj=Object.fromEntries(f.entries());for(const k of Object.keys(obj))obj[k]=String(obj[k]).trim();if(Object.values(obj).some(v=>!v)){alert('すべての項目を入力してください');return}if(obj.companyCode.toLowerCase()==='admin'&&obj.loginId.toLowerCase()==='admin'){alert('管理者と同じ会社コード・ログインIDは登録できません');return}if(db.companies.some(c=>c.id!==editCompany&&c.companyCode===obj.companyCode&&c.loginId===obj.loginId)){alert('同じ会社コードとログインIDの組み合わせが登録済みです');return}if(editing)Object.assign(editing,obj);else db.companies.push({id:uid(),...obj});if(save()){editCompany=null;renderCompanies();renderCaseTree()}});
$('cancelCompany')?.addEventListener('click',()=>{editCompany=null;renderCompanies()});document.querySelectorAll('[data-edit-company]').forEach(b=>b.addEventListener('click',()=>{editCompany=b.dataset.editCompany;renderCompanies();window.scrollTo(0,0)}));document.querySelectorAll('[data-delete-company]').forEach(b=>b.addEventListener('click',()=>{const c=db.companies.find(x=>x.id===b.dataset.deleteCompany);if(!c||!confirm(`${c.companyName} / ${c.person} のアカウントを削除しますか？\n案件の閲覧許可からも外れます。`))return;db.companies=db.companies.filter(x=>x.id!==c.id);db.cases.forEach(x=>x.viewerIds=(x.viewerIds||[]).filter(id=>id!==c.id));if(save()){editCompany=null;renderCompanies();renderCaseTree()}}))}
function renderCases(){
const editing=db.cases.find(c=>c.id===editCase);
const groups=new Map();

  if(/\.csv$/i.test(file.name)){const text=await file.text();grid=parseCsv(text.replace(/^\uFEFF/,''))}
  else {if(!globalThis.XLSX){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Excel読込ライブラリを取得できません。ネット接続を確認するかCSVで取り込んでください。'));document.head.appendChild(script)})}const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellFormula:true});const ws=wb.Sheets[wb.SheetNames[0]];const ref=XLSX.utils.decode_range(ws['!ref']||'A1');for(let y=ref.s.r;y<=ref.e.r;y++){const row=[];for(let x=ref.s.c;x<=ref.e.c;x++){const cell=ws[XLSX.utils.encode_cell({r:y,c:x})];row.push(cell?.f?'='+cell.f:cell?.v??'')}grid.push(row)}}
  if(grid.length<2)throw Error('データ行がありません');
  const head=grid[0].map(x=>String(x||'').trim());const gi=head.indexOf('区分'),mi=head.indexOf('大項目'),ri=head.indexOf('項目');if(gi<0||ri<0)throw Error('先頭行に「区分」「項目」が必要です');
  const dayCols=Array.from({length:7},(_,i)=>head.findIndex(h=>h===`${i+1}日`||h===`日${i+1}`||h===String(i+1)));if(dayCols.some(x=>x<0))throw Error('1日～7日の列が必要です');
  const formulaCol=head.indexOf('計算式');const groups=[];const imported=[];let lastGroup='',lastMajor='';
  for(let i=1;i<grid.length;i++){const raw=grid[i];const group=String(raw[gi]||'').trim()||lastGroup;const major=mi>=0?(String(raw[mi]||'').trim()||lastMajor):'';const name=String(raw[ri]||'').trim()||major;if(!group||!name)continue;if(String(raw[gi]||'').trim())lastMajor='';lastGroup=group;if(mi>=0&&String(raw[mi]||'').trim())lastMajor=major;
   let g=groups.find(x=>x.name===group);if(!g){g={id:uid(),name:group,rows:[]};groups.push(g)}const row={id:'R'+String(imported.length+1).padStart(3,'0'),name,major,formula:''};g.rows.push(row);imported.push({row,raw,sourceIndex:i+1})}
  if(!imported.length)throw Error('取込対象の項目がありません');
  const byExcelRow=new Map(imported.map(x=>[x.sourceIndex,x.row.id]));
  function convert(expr,sourceIndex,dayIndex){return String(expr).replace(/^=/,'').replace(/\$?([A-Z]{1,3})\$?(\d+)/gi,(_,col,n)=>{let index=0;for(const ch of col.toUpperCase())index=index*26+ch.charCodeAt(0)-64;index--;const target=byExcelRow.get(Number(n));if(!target)throw Error(`Excel参照 ${col}${n} は取込範囲外です`);const offset=dayCols.indexOf(index)-dayIndex;if(dayCols.indexOf(index)<0)throw Error(`Excel参照 ${col}${n} は1～7日の列外です`);return `REF(${target},${offset})`})}
  const values={};const dates=getSheetDates();for(const item of imported){const {row,raw,sourceIndex}=item;let f=formulaCol>=0?String(raw[formulaCol]||'').trim():'';const sample=dayCols.map((col,j)=>({v:raw[col],j}));if(!f){const fcell=sample.find(x=>String(x.v).startsWith('='));if(fcell)f=convert(fcell.v,sourceIndex,fcell.j)}else if(f.startsWith('=')){f=convert(f,sourceIndex,0)}if(f)row.formula=f.startsWith('=')?f:'='+f;
   if(!row.formula)for(let d=0;d<dates.length;d++){const value=sample[d%7].v;if(value!==''&&value!==null&&value!==undefined&&!String(value).startsWith('='))values[valueKey(row.id,dates[d])]=value}}
  const old=sheetDraft.groups.length;if(!confirm(`${imported.length}項目・${groups.length}区分を取り込みます。\n現在の${old}区分と入力値は置き換わります。よろしいですか？`))return;
  sheetDraft.groups=groups;sheetDraft.values=values;changed();alert('取込が完了しました。内容を確認して「変更を保存」を押してください。');
 }catch(e){alert('取込できませんでした：'+e.message)}

function parseCsv(text){const result=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);result.push(row);row=[];value=''}else value+=c}if(value||row.length){row.push(value);result.push(row)}return result}
function exportSheet(){const dates=getSheetDates();const rows=[['区分','大項目','項目',...dates]];for(const g of sheetDraft.groups)for(const r of g.rows)rows.push([g.name,r.major||'',r.name,...dates.map(d=>calculate(r,d))]);const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${sheetDraft.name}_${sheetMonth}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
