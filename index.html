<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共有管理システム｜試作版</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#1b2938;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf1fa,#f7f9fc)}.login{width:min(430px,100%);background:white;border-radius:18px;padding:35px;box-shadow:0 18px 60px #1b41651b}.brand{font-weight:800;font-size:24px;letter-spacing:.04em;color:#164a79}.muted{color:#708194;font-size:13px}.login h1{font-size:20px;margin:26px 0 18px}.field{display:grid;gap:6px;margin-bottom:15px}.field label{font-size:13px;font-weight:700;color:#475b70}input,select{border:1px solid #cbd6e2;background:white;border-radius:9px;padding:11px 12px;width:100%;min-width:0;color:#22354a}input:focus,select:focus{outline:2px solid #91b8e5;border-color:#417eb7}.primary{background:#195f9b;border:1px solid #195f9b;color:white}.secondary{background:white;border:1px solid #c5d2df;color:#36536f}.danger{background:#fff;border:1px solid #e2b4b4;color:#a13a3a}.btn{border-radius:9px;padding:10px 15px;font-weight:700}.btn:hover{filter:brightness(.96)}.full{width:100%}.error{color:#b02d3c;font-size:13px;min-height:18px;margin:7px 0}.hint{font-size:12px;color:#718295;background:#f4f7fa;border-radius:8px;padding:10px;margin-top:17px}.app{min-height:100vh;display:flex}.side{width:246px;background:#142d46;color:#fff;flex-shrink:0;display:flex;flex-direction:column}.side .logo{font-size:18px;font-weight:800;padding:26px 20px 5px}.side .sub{padding:0 20px 23px;font-size:11px;color:#a8bed2}.nav{display:grid;gap:5px;padding:0 12px}.nav button{border:0;border-radius:9px;background:transparent;color:#c9d7e5;text-align:left;padding:13px 14px}.nav button.active,.nav button:hover{background:#295474;color:white}.side .bottom{margin-top:auto;padding:16px 18px;border-top:1px solid #ffffff25;font-size:12px;color:#c0d1df}.main{flex:1;min-width:0}.top{height:73px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:10px}.top .account{font-size:13px;color:#52687e}.content{padding:28px 30px;max-width:1350px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.heading h2{margin:0;font-size:23px}.heading p{margin:7px 0 0;color:#758599;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:22px}.stat strong{display:block;font-size:30px;margin-top:6px;color:#164a79}.card{background:white;border:1px solid #e1e8ef;border-radius:13px;padding:22px;margin-bottom:18px}.card h3{margin:0 0 17px;font-size:17px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:7px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}th{text-align:left;background:#f4f7fb;color:#546b81;font-size:12px}th,td{padding:13px 12px;border-bottom:1px solid #e7edf3;vertical-align:middle}td button{font-size:12px;margin-right:5px}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#e9f3fb;color:#28669b;font-size:12px}.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:9px}.check{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid #dbe5ee;border-radius:9px;cursor:pointer}.check input{width:17px;height:17px;flex-shrink:0}.check small{display:block;color:#7d8fa0;font-size:11px}.empty{padding:35px;text-align:center;color:#8393a4;border:1px dashed #d8e2ec;border-radius:11px}.notice{background:#fff8e8;border:1px solid #f0deb2;border-radius:9px;padding:12px 15px;color:#866421;font-size:12px;margin-bottom:20px}.product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.product{background:white;border:1px solid #dfe7ef;border-radius:12px;padding:20px}.product h3{margin:6px 0 10px}.product p{font-size:12px;color:#6e8092}.pill{background:#eaf4eb;color:#397548;border-radius:99px;padding:4px 8px;font-size:11px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.logout{padding:8px 12px;border:1px solid #d9e2eb;background:white;border-radius:8px;color:#48647e}.mobile-menu{display:none}@media(max-width:780px){.app{display:block}.side{width:100%;display:block}.side .logo{padding:14px 17px 3px}.side .sub{padding:0 17px 8px}.nav{display:flex;overflow:auto;padding:8px 10px}.nav button{white-space:nowrap;padding:9px 12px}.side .bottom{display:none}.top{height:auto;min-height:62px;padding:12px 17px}.content{padding:18px 14px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:12px}.stat strong{font-size:23px}.form-grid{grid-template-columns:1fr}.card{padding:16px}.heading h2{font-size:20px}}
</style></head><body>
<section id="loginScreen" class="login-wrap"><div class="login"><div class="brand">共有管理システム</div><div class="muted">取引先・案件情報共有 / DEMO</div><h1>ログイン</h1><form id="loginForm"><div class="field"><label for="loginCompany">会社コード</label><input id="loginCompany" required autocomplete="off" placeholder="会社コード"></div><div class="field"><label for="loginId">ログインID</label><input id="loginId" required autocomplete="username" placeholder="ログインID"></div><div class="field"><label for="loginPassword">パスワード</label><input id="loginPassword" required type="password" autocomplete="current-password" placeholder="パスワード"></div><div class="error" id="loginError" role="alert"></div><button class="btn primary full" type="submit">ログイン</button></form><div class="hint">初期管理者：会社コード・ログインID・パスワードの3か所すべてに <b>admin</b> を入力してください。<br>この試作版では架空の情報だけを使用してください。</div></div></section>
<div id="appScreen" class="app hidden"><aside class="side"><div class="logo">共有管理システム</div><div class="sub">COMPANY PORTAL / DEMO</div><nav class="nav" id="navigation"></nav><div class="bottom">試作版 v1 / ブラウザ内保存</div></aside><main class="main"><header class="top"><div class="account" id="accountInfo"></div><button class="logout" id="logoutBtn">ログアウト</button></header><div class="content" id="pageContent"></div></main></div>
<script>
'use strict';
// DEMO ONLY: browser-local storage and client-side checks are not authentication or access control.
const KEY='shared_management_demo_v1';
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({companies:[],cases:[]});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.companies)&&Array.isArray(d.cases)?d:initial()}catch{return initial()}}
let db=load(),user=null,page='dashboard',editCompany=null,editCase=null;
const uid=()=>globalThis.crypto?.randomUUID?.()??('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('保存できませんでした。ブラウザの保存領域を確認してください。');return false}}
function companyUsers(){return db.companies}
function getAllowedCases(){return user?.admin?db.cases:db.cases.filter(c=>(c.viewerIds||[]).includes(user?.id))}
function showApp(){ $('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('accountInfo').textContent=user.admin?'管理者 / admin':`${user.companyName} / ${user.person}（${user.loginId}）`;renderNav();renderPage() }
function renderNav(){const items=user.admin?[['dashboard','ダッシュボード'],['companies','得意先登録'],['cases','案件登録'],['mycases','案件一覧']]:[['mycases','案件一覧']];$('navigation').innerHTML=items.map(([id,label])=>`<button type="button" data-nav="${id}" class="${page===id?'active':''}">${label}</button>`).join('');$('navigation').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.nav;editCompany=null;editCase=null;renderNav();renderPage()}))}
function heading(title,sub){return `<div class="heading"><div><h2>${title}</h2><p>${sub}</p></div></div>`}
function renderPage(){if(!user)return;renderNav();if(page==='dashboard'&&user.admin)return renderDashboard();if(page==='companies'&&user.admin)return renderCompanies();if(page==='cases'&&user.admin)return renderCases();page='mycases';renderNav();renderMyCases()}
function renderDashboard(){const count=new Set(db.cases.flatMap(c=>c.viewerIds||[])).size;$('pageContent').innerHTML=heading('ダッシュボード','取引先と案件の登録状況を確認できます')+`<div class="notice">この画面は機能確認用です。ログイン情報や登録データはブラウザ内に保存され、実際のセキュリティ機能はありません。</div><div class="stats"><div class="stat"><span class="muted">登録アカウント</span><strong>${db.companies.length}</strong></div><div class="stat"><span class="muted">登録案件</span><strong>${db.cases.length}</strong></div><div class="stat"><span class="muted">案件閲覧者数</span><strong>${count}</strong></div></div><div class="card"><h3>利用の流れ</h3><p>① 得意先登録で会社とログイン情報を登録</p><p>② 案件登録で製品情報と閲覧できる担当者を選択</p><p>③ ログアウトして登録した会社コード・ログインID・パスワードでログイン</p><p class="muted">取引先アカウントでは、閲覧を許可された案件のみ表示されます。</p></div>`}
function renderCompanies(){let editing=db.companies.find(c=>c.id===editCompany);$('pageContent').innerHTML=heading('得意先登録','取引先の会社情報とログインアカウントを管理します')+`<div class="card"><h3>${editing?'登録情報の編集':'新規登録'}</h3><form id="companyForm"><div class="form-grid"><div class="field"><label>会社コード</label><input name="companyCode" required maxlength="40" value="${escapeHtml(editing?.companyCode||'')}" placeholder="例：A001"></div><div class="field"><label>会社名</label><input name="companyName" required maxlength="100" value="${escapeHtml(editing?.companyName||'')}" placeholder="例：A社"></div><div class="field"><label>担当者名</label><input name="person" required maxlength="80" value="${escapeHtml(editing?.person||'')}" placeholder="例：田中"></div><div class="field"><label>ログインID</label><input name="loginId" required maxlength="50" value="${escapeHtml(editing?.loginId||'')}" placeholder="例：tanaka"></div><div class="field"><label>パスワード（試作用）</label><input name="password" required maxlength="100" type="text" value="${escapeHtml(editing?.password||'')}" placeholder="架空のパスワード"></div></div><div class="actions">${editing?'<button class="btn secondary" type="button" id="cancelCompany">キャンセル</button>':''}<button class="btn primary" type="submit">${editing?'変更を保存':'得意先を登録'}</button></div></form></div><div class="card"><h3>登録済みアカウント（${db.companies.length}件）</h3>${db.companies.length?`<div class="table-wrap"><table><thead><tr><th>会社コード</th><th>会社名</th><th>担当者</th><th>ログインID</th><th>操作</th></tr></thead><tbody>${db.companies.map(c=>`<tr><td>${escapeHtml(c.companyCode)}</td><td>${escapeHtml(c.companyName)}</td><td>${escapeHtml(c.person)}</td><td>${escapeHtml(c.loginId)}</td><td><button class="btn secondary" data-edit-company="${c.id}">編集</button><button class="btn danger" data-delete-company="${c.id}">削除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">登録された取引先はありません</div>'}</div>`;
$('companyForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const obj=Object.fromEntries(f.entries());for(const k of Object.keys(obj))obj[k]=String(obj[k]).trim();if(Object.values(obj).some(v=>!v)){alert('すべての項目を入力してください');return}if(obj.companyCode.toLowerCase()==='admin'&&obj.loginId.toLowerCase()==='admin'){alert('管理者と同じ会社コード・ログインIDは登録できません');return}if(db.companies.some(c=>c.id!==editCompany&&c.companyCode===obj.companyCode&&c.loginId===obj.loginId)){alert('同じ会社コードとログインIDの組み合わせが登録済みです');return}if(editing)Object.assign(editing,obj);else db.companies.push({id:uid(),...obj});if(save()){editCompany=null;renderCompanies()}});
$('cancelCompany')?.addEventListener('click',()=>{editCompany=null;renderCompanies()});document.querySelectorAll('[data-edit-company]').forEach(b=>b.addEventListener('click',()=>{editCompany=b.dataset.editCompany;renderCompanies();window.scrollTo(0,0)}));document.querySelectorAll('[data-delete-company]').forEach(b=>b.addEventListener('click',()=>{const c=db.companies.find(x=>x.id===b.dataset.deleteCompany);if(!c||!confirm(`${c.companyName} / ${c.person} のアカウントを削除しますか？\n案件の閲覧許可からも外れます。`))return;db.companies=db.companies.filter(x=>x.id!==c.id);db.cases.forEach(x=>x.viewerIds=(x.viewerIds||[]).filter(id=>id!==c.id));if(save()){editCompany=null;renderCompanies()}}))}
function renderCases(){const editing=db.cases.find(c=>c.id===editCase);$('pageContent').innerHTML=heading('案件登録','製品情報を登録し、閲覧を許可する担当者を指定します')+`<div class="card"><h3>${editing?'案件の編集':'新規案件'}</h3><form id="caseForm"><div class="form-grid"><div class="field"><label>製品コード</label><input name="productCode" required maxlength="60" value="${escapeHtml(editing?.productCode||'')}" placeholder="例：PRD-001"></div><div class="field"><label>製品名</label><input name="productName" required maxlength="120" value="${escapeHtml(editing?.productName||'')}" placeholder="例：樹脂部品A"></div></div><h3 style="margin-top:12px">この案件を表示できる人</h3><p class="muted">許可する担当者にチェックを入れてください。管理者はすべての案件を確認できます。</p>${db.companies.length?`<div class="checks">${db.companies.map(c=>`<label class="check"><input type="checkbox" name="viewer" value="${c.id}" ${(editing?.viewerIds||[]).includes(c.id)?'checked':''}><span><b>${escapeHtml(c.person)}</b><small>${escapeHtml(c.companyName)} / ${escapeHtml(c.loginId)}</small></span></label>`).join('')}</div>`:'<div class="empty">得意先登録でアカウントを追加すると、ここで閲覧者を選択できます。</div>'}<div class="actions">${editing?'<button class="btn secondary" type="button" id="cancelCase">キャンセル</button>':''}<button class="btn primary" type="submit">${editing?'変更を保存':'案件を登録'}</button></div></form></div><div class="card"><h3>登録済み案件（${db.cases.length}件）</h3>${db.cases.length?`<div class="table-wrap"><table><thead><tr><th>製品コード</th><th>製品名</th><th>閲覧許可</th><th>操作</th></tr></thead><tbody>${db.cases.map(c=>`<tr><td>${escapeHtml(c.productCode)}</td><td><b>${escapeHtml(c.productName)}</b></td><td>${(c.viewerIds||[]).length}人 <span class="muted">${escapeHtml((c.viewerIds||[]).map(id=>db.companies.find(x=>x.id===id)?.person).filter(Boolean).join('、'))}</span></td><td><button class="btn secondary" data-edit-case="${c.id}">編集</button><button class="btn danger" data-delete-case="${c.id}">削除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">案件はまだ登録されていません</div>'}</div>`;
$('caseForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const productCode=String(f.get('productCode')||'').trim(),productName=String(f.get('productName')||'').trim(),viewerIds=f.getAll('viewer').filter(id=>db.companies.some(c=>c.id===id));if(!productCode||!productName){alert('製品コードと製品名を入力してください');return}if(db.cases.some(c=>c.id!==editCase&&c.productCode===productCode)){alert('同じ製品コードの案件が登録済みです');return}if(editing)Object.assign(editing,{productCode,productName,viewerIds});else db.cases.push({id:uid(),productCode,productName,viewerIds});if(save()){editCase=null;renderCases()}});
$('cancelCase')?.addEventListener('click',()=>{editCase=null;renderCases()});document.querySelectorAll('[data-edit-case]').forEach(b=>b.addEventListener('click',()=>{editCase=b.dataset.editCase;renderCases();window.scrollTo(0,0)}));document.querySelectorAll('[data-delete-case]').forEach(b=>b.addEventListener('click',()=>{const c=db.cases.find(x=>x.id===b.dataset.deleteCase);if(c&&confirm(`${c.productName} を削除しますか？`)){db.cases=db.cases.filter(x=>x.id!==c.id);if(save()){editCase=null;renderCases()}}}))}
function renderMyCases(){const cases=getAllowedCases();$('pageContent').innerHTML=heading('案件一覧',user.admin?'登録されたすべての案件':'閲覧を許可された案件だけが表示されます')+`<div class="notice">管理表本体は次の段階で追加します。今回は案件の登録・表示権限の確認までです。</div>${cases.length?`<div class="product-list">${cases.map(c=>`<article class="product"><div class="row"><span class="tag">${escapeHtml(c.productCode)}</span><span class="pill">閲覧可能</span></div><h3>${escapeHtml(c.productName)}</h3><p>管理表：次の段階で追加予定</p></article>`).join('')}</div>`:'<div class="empty">表示できる案件はまだありません</div>'}`}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();const code=$('loginCompany').value.trim(),id=$('loginId').value.trim(),pw=$('loginPassword').value;let found=null;if(code==='admin'&&id==='admin'&&pw==='admin')found={admin:true,id:'admin'};else{const c=companyUsers().find(c=>c.companyCode===code&&c.loginId===id&&c.password===pw);if(c)found={...c,admin:false}}if(!found){$('loginError').textContent='会社コード・ログインID・パスワードを確認してください。';return}user=found;page=user.admin?'dashboard':'mycases';$('loginError').textContent='';$('loginForm').reset();showApp()});
$('logoutBtn').addEventListener('click',()=>{user=null;editCompany=null;editCase=null;$('appScreen').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('loginError').textContent=''});
</script></body></html>
