<section id="loginScreen" class="login-wrap"><div class="login"><div class="brand">共有管理システム</div><div class="muted">取引先・案件情報共有 / DEMO</div><h1>ログイン</h1><form id="loginForm"><div class="field"><label for="loginCompany">会社コード</label><input id="loginCompany" required autocomplete="off" placeholder="会社コード"></div><div class="field"><label for="loginId">ログインID</label><input id="loginId" required autocomplete="username" placeholder="ログインID"></div><div class="field"><label for="loginPassword">パスワード</label><input id="loginPassword" required type="password" autocomplete="current-password" placeholder="パスワード"></div><div class="error" id="loginError" role="alert"></div><button class="btn primary full" type="submit">ログイン</button></form><div class="hint">初期管理者：会社コード・ログインID・パスワードの3か所すべてに <b>admin</b> を入力してください。<br>この試作版では架空の情報だけを使用してください。</div></div></section>
<div id="appScreen" class="app hidden"><aside class="side"><div class="logo">共有管理システム</div><div class="sub">COMPANY PORTAL / DEMO</div><nav class="nav" id="navigation"></nav><div class="side-tree" id="caseTree"></div><div class="bottom">試作版 v4 / ブラウザ内保存</div></aside><main class="main"><header class="top"><div class="account" id="accountInfo"></div><button class="logout" id="logoutBtn">ログアウト</button></header><div class="content" id="pageContent"></div></main></div>
<style>
.inventory-backdrop{position:fixed;inset:0;background:#13263b99;z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px}.inventory-dialog{background:#fff;border-radius:14px;padding:22px;width:min(1050px,100%);max-height:92vh;overflow:auto;box-shadow:0 16px 55px #0004}.inventory-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.inventory-head h2{margin:0 0 15px}.inventory-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.inventory-controls input{width:180px}.inventory-table{min-width:760px}.inventory-table input[type=checkbox]{width:18px;height:18px}.inventory-table input[type=text]{width:105px;padding:8px}.inventory-table textarea{width:100%;min-width:180px;padding:8px;border:1px solid #cbd6e2;border-radius:8px;resize:vertical}.inventory-table .muted-row{opacity:.45}.inventory-table td{padding:8px}.inventory-error{color:#a13a3a;font-weight:700}.inventory-ok{color:#267647;font-weight:700}.inventory-history{margin-top:12px}.inventory-history td{vertical-align:top}.inventory-table .inventory-comment{min-width:220px}.inventory-history .inventory-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.inventory-history .deleted-record{opacity:.6;background:#f5f5f5}.inventory-note{background:#f4f7fb;border-radius:8px;padding:10px;color:#53677b;font-size:12px}
</style><div id="inventoryModal" class="inventory-backdrop hidden" role="dialog" aria-modal="true" aria-label="棚卸管理"><div class="inventory-dialog"><div class="inventory-head"><h2>棚卸管理</h2><button type="button" class="btn secondary" id="inventoryClose">閉じる</button></div><div id="inventoryContent"></div></div></div><script>
'use strict';
// DEMO ONLY: browser-local storage and client-side checks are not authentication or access control.
const KEY='shared_management_demo_v1';
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({companies:[],cases:[],inventoryRecords:[]});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.companies)&&Array.isArray(d.cases)?d:initial()}catch{return initial()}}
let db=load(),user=null,page='dashboard',editCompany=null,editCase=null,selectedCaseId=null;
const expandedCompanies=new Set();
let inventoryView="entry", inventoryDate="", inventorySelected={}, inventoryActual={}, inventoryComments={};
let activeSheetId=null, sheetDraft=null, sheetMonth=new Date().toISOString().slice(0,7), sheetDirty=false, formulaMode=null;
const uid=()=>globalThis.crypto?.randomUUID?.()??('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('保存できませんでした。ブラウザの保存領域を確認してください。');return false}}
function companyUsers(){return db.companies}
function getAllowedCases(){return user?.admin?db.cases:db.cases.filter(c=>(c.viewerIds||[]).includes(user?.id))}
function showApp(){ $('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('accountInfo').textContent=user.admin?'管理者 / admin':`${user.companyName} / ${user.person}（${user.loginId}）`;renderNav();renderPage() }
function renderNav(){const items=user.admin?[['dashboard','ダッシュボード'],['companies','得意先登録'],['cases','案件登録'],['mycases','案件一覧']]:[['mycases','トップ']];$('navigation').innerHTML=items.map(([id,label])=>`<button type="button" data-nav="${id}" class="${page===id?'active':''}">${label}</button>`).join('');$('navigation').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(page==='sheet'&&!askLeaveSheet())return;page=b.dataset.nav;selectedCaseId=null;activeSheetId=null;sheetDraft=null;editCompany=null;editCase=null;renderPage()}));renderCaseTree()}
function renderCaseTree(){
 const allowed=getAllowedCases();const groups=new Map();
 for(const account of db.companies){if(!groups.has(account.companyCode))groups.set(account.companyCode,{code:account.companyCode,name:account.companyName,cases:new Map()})}
 for(const c of allowed){for(const id of c.viewerIds||[]){const account=db.companies.find(a=>a.id===id);if(!account)continue;const g=groups.get(account.companyCode);if(g)g.cases.set(c.id,c)}}
 // Administrators can also see cases without an assigned viewer.
 if(user.admin){const orphan=allowed.filter(c=>!(c.viewerIds||[]).some(id=>db.companies.some(a=>a.id===id)));if(orphan.length)groups.set('__unassigned__',{code:'__unassigned__',name:'閲覧者未設定',cases:new Map(orphan.map(c=>[c.id,c]))})}
 const visible=[...groups.values()].filter(g=>g.cases.size&&(user.admin||g.code!==user.companyCode));
 $('caseTree').innerHTML=`<div class="tree-heading">会社別の案件</div>${visible.length?visible.map(g=>`<details class="tree-company" data-company="${escapeHtml(g.code)}" ${expandedCompanies.has(g.code)?'open':''}><summary><span class="tree-name">${escapeHtml(g.name)}</span><span class="tree-number">${g.cases.size}件</span></summary><div class="tree-products">${[...g.cases.values()].map(c=>`<button type="button" data-tree-case="${escapeHtml(c.id)}" class="${page==='caseDetail'&&selectedCaseId===c.id?'active':''}" title="${escapeHtml(c.productCode)}">${escapeHtml(c.productName)}</button>`).join('')}</div></details>`).join(''):'<div class="tree-empty">表示できる案件はありません</div>'}`;
 $('caseTree').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)expandedCompanies.add(d.dataset.company);else expandedCompanies.delete(d.dataset.company)}));
 $('caseTree').querySelectorAll('[data-tree-case]').forEach(b=>b.addEventListener('click',()=>{selectedCaseId=b.dataset.treeCase;activeSheetId=null;sheetDraft=null;page='caseDetail';renderPage()}));
}
function heading(title,sub){return `<div class="heading"><div><h2>${title}</h2><p>${sub}</p></div></div>`}
function renderPage(){if(!user)return;renderNav();if(page==='dashboard'&&user.admin)return renderDashboard();if(page==='companies'&&user.admin)return renderCompanies();if(page==='cases'&&user.admin)return renderCases();if(page==='caseDetail')return renderCaseDetail();if(page==='sheet')return renderSheet();page='mycases';renderNav();renderMyCases()}
function renderDashboard(){const count=new Set(db.cases.flatMap(c=>c.viewerIds||[])).size;$('pageContent').innerHTML=heading('ダッシュボード','取引先と案件の登録状況を確認できます')+`<div class="notice">この画面は機能確認用です。ログイン情報や登録データはブラウザ内に保存され、実際のセキュリティ機能はありません。</div><div class="stats"><div class="stat"><span class="muted">登録アカウント</span><strong>${db.companies.length}</strong></div><div class="stat"><span class="muted">登録案件</span><strong>${db.cases.length}</strong></div><div class="stat"><span class="muted">案件閲覧者数</span><strong>${count}</strong></div></div><div class="card"><h3>利用の流れ</h3><p>① 得意先登録で会社とログイン情報を登録</p><p>② 案件登録で製品情報と閲覧できる担当者を選択</p><p>③ ログアウトして登録した会社コード・ログインID・パスワードでログイン</p><p class="muted">取引先アカウントでは、閲覧を許可された案件のみ表示されます。</p></div>`}
function renderCompanies(){let editing=db.companies.find(c=>c.id===editCompany);$('pageContent').innerHTML=heading('得意先登録','取引先の会社情報とログインアカウントを管理します')+`<div class="card"><h3>${editing?'登録情報の編集':'新規登録'}</h3><form id="companyForm"><div class="form-grid"><div class="field"><label>会社コード</label><input name="companyCode" required maxlength="40" value="${escapeHtml(editing?.companyCode||'')}" placeholder="例：A001"></div><div class="field"><label>会社名</label><input name="companyName" required maxlength="100" value="${escapeHtml(editing?.companyName||'')}" placeholder="例：A社"></div><div class="field"><label>担当者名</label><input name="person" required maxlength="80" value="${escapeHtml(editing?.person||'')}" placeholder="例：田中"></div><div class="field"><label>ログインID</label><input name="loginId" required maxlength="50" value="${escapeHtml(editing?.loginId||'')}" placeholder="例：tanaka"></div><div class="field"><label>パスワード（試作用）</label><input name="password" required maxlength="100" type="text" value="${escapeHtml(editing?.password||'')}" placeholder="架空のパスワード"></div></div><div class="actions">${editing?'<button class="btn secondary" type="button" id="cancelCompany">キャンセル</button>':''}<button class="btn primary" type="submit">${editing?'変更を保存':'得意先を登録'}</button></div></form></div><div class="card"><h3>登録済みアカウント（${db.companies.length}件）</h3>${db.companies.length?`<div class="table-wrap"><table><thead><tr><th>会社コード</th><th>会社名</th><th>担当者</th><th>ログインID</th><th>操作</th></tr></thead><tbody>${db.companies.map(c=>`<tr><td>${escapeHtml(c.companyCode)}</td><td>${escapeHtml(c.companyName)}</td><td>${escapeHtml(c.person)}</td><td>${escapeHtml(c.loginId)}</td><td><button class="btn secondary" data-edit-company="${c.id}">編集</button><button class="btn danger" data-delete-company="${c.id}">削除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">登録された取引先はありません</div>'}</div>`;

function getSheetDates(){const [y,m]=sheetMonth.split('-').map(Number);return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>`${sheetMonth}-${String(i+1).padStart(2,'0')}`)}

function valueKey(id,date){return id+'|'+date}
function adjacentDate(date,offset){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function displayFormula(formula){return String(formula||'')
 .replace(/REF\(([A-Z0-9_-]+),\s*(-?\d+)\)/gi,(_,id,offset)=>{const r=allRows().find(x=>x.id===id);const n=Number(offset);return (r?.name||id)+(n===0?'（当日）':n===-1?'（前日）':n===1?'（翌日）':`（${n>0?'+':''}${n}日）`)})
 .replace(/PREV\(([A-Z0-9_-]+)\)/gi,(_,id)=>(allRows().find(x=>x.id===id)?.name||id)+'（前日）')
 .replace(/ROW\(([A-Z0-9_-]+)\)/gi,(_,id)=>(allRows().find(x=>x.id===id)?.name||id)+'（当日）')
 .replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' ＋ ').replace(/-/g,' − ')}
function formulaDescription(row){return row.name+' ＝ '+displayFormula(row.formula).replace(/^\s*=\s*/,'').trim()}
let formulaHoverTimer=null;

 const popup=document.getElementById('formulaHoverPopup')||(()=>{const el=document.createElement('div');el.id='formulaHoverPopup';el.className='formula-hover-popup';el.setAttribute('role','tooltip');document.body.appendChild(el);return el})();
 const hide=()=>{clearTimeout(formulaHoverTimer);popup.classList.remove('visible')};

function inventoryRecord(sheetId,rowId,date){return (db.inventoryRecords||[]).find(x=>x.sheetId===sheetId&&x.rowId===rowId&&x.date===date&&x.status==='confirmed')}
function inventoryAdjusted(row,date){return inventoryRecord(sheetDraft?.id,row.id,date)}
function calculate(row,date,stack=new Set(),ignoreInventory=false){
 if(!ignoreInventory){const inv=inventoryAdjusted(row,date);if(inv)return inv.actual;}
 const key=valueKey(row.id,date);if(stack.has(key))return '#循環';
 const override=sheetDraft.cellFormulas?.[key];
 const formula=override??row.formula;
 if(!formula)return sheetDraft.values[key]??'';
 // An out-of-month date is the initial boundary, unless a value was explicitly saved.
 // Never recursively apply the monthly formula to dates outside the displayed month.
 if(!date.startsWith(sheetMonth+'-'))return sheetDraft.values[key]??0;
 stack=new Set(stack);stack.add(key);
 const dates=getSheetDates(),index=dates.indexOf(date);
 const parseValue=(id,at)=>{const r=allRows().find(x=>x.id===id);if(!r||!at)return 0;const v=calculate(r,at,stack);if(String(v).startsWith('#'))throw Error(String(v));return Number(v)||0};
 try{
  let exp=formula.trim().replace(/^=/,'').toUpperCase();
  exp=exp.replace(/REF\(([A-Z0-9_-]+),(-?\d+)\)/g,(_,id,offset)=>String(parseValue(id,adjacentDate(date,Number(offset)))));
  exp=exp.replace(/PREV\(([A-Z0-9_-]+)\)/g,(_,id)=>String(parseValue(id,adjacentDate(date,-1))));
  exp=exp.replace(/ROW\(([A-Z0-9_-]+)\)/g,(_,id)=>String(parseValue(id,date)));
  // Only numbers and arithmetic operators are accepted; no JavaScript execution.
  if(!/^[\d\s.+*/()%\-]+$/.test(exp)||exp.length>300)throw Error('#式エラー');
  const tokens=exp.match(/\d+(?:\.\d+)?|[()+*/%-]/g)||[];let pos=0;
  function atom(){const t=tokens[pos++];if(t==='('){const v=add();if(tokens[pos++]!==')')throw Error();return v}if(t==='-')return -atom();if(t==='+')return atom();if(!t||!/^\d/.test(t))throw Error();return Number(t)}
  function mult(){let v=atom();while(['*','/','%'].includes(tokens[pos])){const op=tokens[pos++],b=atom();v=op==='*'?v*b:op==='/'?v/b:v%b}return v}
  function add(){let v=mult();while(['+','-'].includes(tokens[pos])){const op=tokens[pos++],b=mult();v=op==='+'?v+b:v-b}return v}
  const result=add();if(pos!==tokens.length||!Number.isFinite(result))throw Error();return Math.round(result*1000000)/1000000;
 }catch(e){return e.message?.startsWith('#')?e.message:'#式エラー'}
}
function startFormulaMode(rowId){
 const r=allRows().find(x=>x.id===rowId);if(!r||!user?.admin)return;
 const anchor=getSheetDates()[Math.min(6,getSheetDates().length-1)];
 formulaMode={rowId,anchor,expression:sheetDraft.cellFormulas?.[valueKey(rowId,anchor)]??r.formula??'='};renderSheet();
}
function formulaPanel(){if(!formulaMode)return '';
 const r=allRows().find(x=>x.id===formulaMode.rowId);if(!r)return '';
 return `<div class="formula-panel"><div><b>計算式モード：${escapeHtml(r.name)}</b><p class="muted">基準日を選び、参照したいセルをクリック。＋ − × ÷ や括弧を追加して「この行に適用」。前日のセルも選択できます。</p></div><label>基準日 <select id="formulaAnchor">${getSheetDates().map(d=>`<option value="${d}" ${formulaMode.anchor===d?'selected':''}>${Number(d.slice(-2))}日</option>`).join('')}</select></label><div class="formula-editor"><input id="formulaExpression" spellcheck="false" value="${escapeHtml(formulaMode.expression)}" aria-label="計算式"></div><div class="formula-ops">${['+','−','×','÷','(',')'].map((x,i)=>`<button type="button" class="mini" data-formula-op="${['+','-','*','/','(',')'][i]}">${x}</button>`).join('')}<button type="button" class="mini" id="formulaUndo">1つ戻す</button><button type="button" class="mini" id="formulaClear">クリア</button></div><div class="muted" id="formulaHuman">${escapeHtml(displayFormula(formulaMode.expression))}</div><div class="actions"><button class="btn secondary" id="formulaCancel">キャンセル</button><button class="btn secondary" id="formulaApplyOne">この日付だけに適用</button><button class="btn primary" id="formulaApply">この行の全日付に適用</button></div></div>`;
}
function bindFormulaPanel(){if(!formulaMode)return;
 const input=$('formulaExpression');const sync=()=>{formulaMode.expression=input.value;$('formulaHuman').textContent=displayFormula(input.value)};
 input.oninput=sync;
 $('formulaAnchor').onchange=e=>{formulaMode.expression=input.value;formulaMode.anchor=e.target.value;renderSheet()};
 document.querySelectorAll('[data-formula-op]').forEach(b=>b.onclick=()=>{input.value+=b.dataset.formulaOp;sync();input.focus()});
 $('formulaUndo').onclick=()=>{input.value=input.value.replace(/REF\([^)]+\)$|.$/,'');sync()};
 $('formulaClear').onclick=()=>{input.value='=';sync()};
 $('formulaCancel').onclick=()=>{formulaMode=null;renderSheet()};
 const getExpression=()=>{const expr=input.value.trim();if(expr&&expr!=='='&&!/^=[\w\d+*/%().,\s-]+$/i.test(expr)){alert('計算式に使用できない文字があります');return null}return expr==='='?'':expr};
 $('formulaApply').onclick=()=>{if(!user?.admin)return;const r=allRows().find(x=>x.id===formulaMode.rowId);const expr=getExpression();if(expr===null)return;r.formula=expr;sheetDraft.cellFormulas??={};for(const k of Object.keys(sheetDraft.cellFormulas))if(k.startsWith(r.id+'|'))delete sheetDraft.cellFormulas[k];formulaMode=null;changed()};
 $('formulaApplyOne').onclick=()=>{if(!user?.admin)return;const expr=getExpression();if(expr===null)return;sheetDraft.cellFormulas??={};const key=valueKey(formulaMode.rowId,formulaMode.anchor);if(expr)sheetDraft.cellFormulas[key]=expr;else delete sheetDraft.cellFormulas[key];formulaMode=null;changed()};
 document.querySelectorAll('[data-formula-ref]').forEach(td=>td.onclick=()=>{const delta=Math.round((new Date(td.dataset.formulaDate+'T12:00:00')-new Date(formulaMode.anchor+'T12:00:00'))/86400000);if(Math.abs(delta)>31){alert('参照できる日付範囲を超えています');return}input.value+=`REF(${td.dataset.formulaRef},${delta})`;sync();td.classList.add('formula-picked');input.focus()});
}
function renderSheet(){

  const formulaCol=head.indexOf('計算式');const groups=[];const imported=[];let lastGroup='',lastMajor='';

   let g=groups.find(x=>x.name===group);if(!g){g={id:uid(),name:group,rows:[]};groups.push(g)}const row={id:'R'+String(imported.length+1).padStart(3,'0'),name,major,formula:''};g.rows.push(row);imported.push({row,raw,sourceIndex:i+1})}

function parseCsv(text){const result=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);result.push(row);row=[];value=''}else value+=c}if(value||row.length){row.push(value);result.push(row)}return result}

 if(comment===null)return;
 if(diff!==0&&!comment.trim()){alert('差異がある場合は理由・コメントが必須です。');return}
 if(!confirm(`${rec.date} ${rec.companyName} / ${rec.rowName}\n実棚 ${rec.actual} → ${actual}\n差異 ${rec.diff} → ${diff}\n\n変更して管理表を再計算しますか？`))return;
 const backup=structuredClone(rec);rec.edits??=[];rec.edits.push({at:new Date().toLocaleString('ja-JP'),by:inventoryActor(),oldActual:rec.actual,newActual:actual,oldBook:rec.book,newBook:book,oldDiff:rec.diff,newDiff:diff,oldComment:rec.comment||'',newComment:comment.trim()});
 rec.book=book;rec.actual=actual;rec.diff=diff;rec.comment=comment.trim();
 if(save())renderInventory();else Object.assign(rec,backup);
}
function deleteInventoryRecord(id){
 const rec=(db.inventoryRecords||[]).find(x=>x.id===id);if(!canModifyInventory(rec))return;
 if(!confirm(`${rec.date} ${rec.companyName} / ${rec.rowName} の棚卸を削除しますか？\n\n棚卸による在庫補正を解除し、管理表を通常の計算式で再計算します。\n削除済みの記録は履歴に残ります。`))return;
 const backup=structuredClone(rec);rec.status='deleted';rec.deletedAt=new Date().toLocaleString('ja-JP');rec.deletedBy=inventoryActor();
 if(save())renderInventory();else Object.assign(rec,backup);
}
function renderInventory(){
 const container=$('inventoryContent');const history=(db.inventoryRecords||[]).filter(x=>x.sheetId===sheetDraft.id&&(user.admin||x.companyCode===user.companyCode));
 const tabs=`<div class="inventory-controls"><button class="btn ${inventoryView==='entry'?'primary':'secondary'}" id="invEntryTab">棚卸登録</button><button class="btn ${inventoryView==='history'?'primary':'secondary'}" id="invHistoryTab">棚卸履歴</button></div>`;
 if(inventoryView==='history'){
  container.innerHTML=tabs+`<p class="muted">編集すると実棚数・差異・理由が更新され、管理表も再計算されます。削除すると棚卸補正を解除し、通常の計算式に戻します。削除済みの記録は履歴に残します。</p><div class="table-wrap"><table class="inventory-history"><thead><tr><th>棚卸日</th><th>会社</th><th>項目</th><th>帳簿</th><th>実棚</th><th>差異</th><th>理由・追記</th><th>登録者／日時</th><th>操作</th></tr></thead><tbody>${[...history].sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt))).map(x=>{const active=x.status==='confirmed';return `<tr class="${active?'':'deleted-record'}"><td>${escapeHtml(x.date)}${active?'':'<br><strong>削除済み</strong>'}</td><td>${escapeHtml(x.companyName)}</td><td>${escapeHtml(x.rowName)}</td><td>${escapeHtml(x.book)}</td><td>${escapeHtml(x.actual)}</td><td class="${x.diff<0?'negative':''}">${x.diff>0?'+':''}${escapeHtml(x.diff)}</td><td>${escapeHtml(x.comment||'—').replace(/\n/g,'<br>')}${x.additions?.length?'<hr>'+x.additions.map(a=>`<div>${escapeHtml(a.text)} <small class="muted">(${escapeHtml(a.by)} / ${escapeHtml(a.at)})</small></div>`).join(''):''}${x.edits?.length?'<hr><small class="muted">編集履歴：'+x.edits.map(e=>`${escapeHtml(e.at)} ${escapeHtml(e.by)}（実棚 ${escapeHtml(e.oldActual)} → ${escapeHtml(e.newActual)}）`).join(' / ')+'</small>':''}${x.deletedAt?`<hr><small class="muted">削除：${escapeHtml(x.deletedBy)} / ${escapeHtml(x.deletedAt)}</small>`:''}</td><td>${escapeHtml(x.createdBy)}<br><small>${escapeHtml(x.createdAt)}</small></td><td>${active?`<div class="inventory-actions"><button class="mini" data-inv-note="${escapeHtml(x.id)}">理由を追記</button><button class="mini" data-inv-edit="${escapeHtml(x.id)}">編集</button><button class="mini danger-text" data-inv-delete="${escapeHtml(x.id)}">削除</button></div>`:'—'}</td></tr>`}).join('')}</tbody></table></div>${history.length?'':'<div class="empty">棚卸履歴はありません。</div>'}`;
  container.querySelectorAll('[data-inv-note]').forEach(b=>b.onclick=()=>{const rec=db.inventoryRecords.find(x=>x.id===b.dataset.invNote&&x.status==='confirmed');if(!rec||!canModifyInventory(rec))return;const note=prompt('理由・調査結果を追記（元のコメントは変更しません）');if(!note?.trim())return;const before=structuredClone(rec);rec.additions??=[];rec.additions.push({text:note.trim(),by:inventoryActor(),at:new Date().toLocaleString('ja-JP')});if(save())renderInventory();else Object.assign(rec,before)});
  container.querySelectorAll('[data-inv-edit]').forEach(b=>b.onclick=()=>editInventoryRecord(b.dataset.invEdit));
  container.querySelectorAll('[data-inv-delete]').forEach(b=>b.onclick=()=>deleteInventoryRecord(b.dataset.invDelete));
 }else{
  const candidates=inventoryCandidates();const days=getSheetDates();const dateOk=days.includes(inventoryDate);
  container.innerHTML=tabs+`<div class="inventory-controls"><label>棚卸日 <input type="date" id="invDate" value="${inventoryDate}"></label><span class="muted">${candidates.length}項目が棚卸対象に設定されています</span></div><p class="inventory-note">管理者が「在庫指定」した項目だけを表示します。チェックを入れると実棚数とコメントが入力できます。差異がある場合は理由が必須です。棚卸は当日の入出庫が完了した時点の数量として扱います。</p><div class="table-wrap"><table class="inventory-table"><thead><tr><th>対象</th><th>会社／大項目／項目</th><th>帳簿在庫</th><th>実棚数</th><th>差異</th><th>理由・コメント</th></tr></thead><tbody>${candidates.map(({g,r})=>{const k=r.id,selected=!!inventorySelected[k],book=dateOk?inventoryBook(r,inventoryDate):'';const prev=inventoryRecord(sheetDraft.id,k,inventoryDate);const actual=inventoryActual[k]??'';const diff=/^\d+(?:\.\d+)?$/.test(actual)&&Number.isFinite(Number(book))?Number(actual)-Number(book):null;return `<tr class="${selected?'':'muted-row'}"><td><input type="checkbox" data-inv-check="${escapeHtml(k)}" ${selected?'checked':''} ${prev?'disabled title="確定済み"':''}></td><td>${escapeHtml(g.name)}<br><small>${escapeHtml(r.major||'')} / ${escapeHtml(r.name)}</small>${prev?'<br><span class="inventory-ok">確定済み</span>':''}</td><td>${escapeHtml(book)}</td><td><input type="text" inputmode="decimal" data-inv-actual="${escapeHtml(k)}" value="${escapeHtml(actual)}" ${!selected?'disabled':''} placeholder="数量"></td><td class="${diff!==null&&diff<0?'negative':''}" data-inv-diff="${escapeHtml(k)}">${selected&&diff!==null?(diff>0?'+':'')+diff:'—'}</td><td class="inventory-comment"><textarea rows="2" data-inv-comment="${escapeHtml(k)}" ${!selected?'disabled':''} placeholder="差異理由（差異ありの場合は必須）">${escapeHtml(inventoryComments[k]||'')}</textarea></td></tr>`}).join('')}</tbody></table></div><div class="actions"><span id="invMessage" class="inventory-error"></span><button class="btn primary" id="invReview">内容を確認</button></div>`;
  $('invDate').onchange=e=>{if(!getSheetDates().includes(e.target.value)){alert('現在表示中の月の日付を選んでください');e.target.value=inventoryDate;return}inventoryDate=e.target.value;inventorySelected={};inventoryActual={};inventoryComments={};renderInventory()};
  container.querySelectorAll('[data-inv-check]').forEach(e=>e.onchange=()=>{inventorySelected[e.dataset.invCheck]=e.checked;renderInventory()});
  container.querySelectorAll('[data-inv-actual]').forEach(e=>e.oninput=()=>{if(!/^\d*(?:\.\d*)?$/.test(e.value))e.value=e.value.replace(/[^0-9.]/g,'');inventoryActual[e.dataset.invActual]=e.value;const r=allRows().find(r=>r.id===e.dataset.invActual),book=Number(inventoryBook(r,inventoryDate)),d=e.value===''?null:Number(e.value)-book;const cell=container.querySelector(`[data-inv-diff="${e.dataset.invActual}"]`);cell.textContent=d===null?'—':(d>0?'+':'')+d;cell.classList.toggle('negative',d!==null&&d<0)});
  container.querySelectorAll('[data-inv-comment]').forEach(e=>e.oninput=()=>inventoryComments[e.dataset.invComment]=e.value);
  $('invReview').onclick=()=>reviewInventory();
 }
 $('invEntryTab').onclick=()=>{inventoryView='entry';renderInventory()};$('invHistoryTab').onclick=()=>{inventoryView='history';renderInventory()};
}
function reviewInventory(){
 const selected=inventoryCandidates().filter(({r})=>inventorySelected[r.id]);if(!selected.length){$('invMessage').textContent='棚卸対象を選択してください';return}
 const records=[];for(const {g,r} of selected){const val=inventoryActual[r.id],book=Number(inventoryBook(r,inventoryDate));if(!/^\d+(?:\.\d+)?$/.test(val)||!Number.isFinite(book)){alert(`${r.name}：実棚数または帳簿数を確認してください`);return}const actual=Number(val),diff=Math.round((actual-book)*1e6)/1e6,comment=(inventoryComments[r.id]||'').trim();if(diff!==0&&!comment){alert(`${r.name}：差異があるため理由を入力してください`);return}if(inventoryRecord(sheetDraft.id,r.id,inventoryDate)){alert(`${r.name}：この日付の棚卸は確定済みです`);return}records.push({id:uid(),sheetId:sheetDraft.id,caseId:sheetDraft.caseId,rowId:r.id,rowName:r.name,companyCode:groupCompanyCode(g),companyName:g.name,date:inventoryDate,book,actual,diff,comment,status:'confirmed',createdAt:new Date().toLocaleString('ja-JP'),createdBy:user.admin?'管理者':`${user.companyName} / ${user.person}`,additions:[]})}
 const summary=records.map(x=>`${x.companyName} / ${x.rowName}：帳簿 ${x.book} → 実棚 ${x.actual}（差異 ${x.diff>0?'+':''}${x.diff}）${x.comment?'\n理由：'+x.comment:''}`).join('\n\n');
 if(!confirm(`棚卸日：${inventoryDate}\n${records.length}項目を確定します。翌日以降の在庫計算に反映します。\n\n${summary}\n\n確定しますか？`))return;
 db.inventoryRecords??=[];db.inventoryRecords.push(...records);if(save()){inventoryView='history';renderInventory()}else db.inventoryRecords.splice(-records.length);
}

function exportSheet(){const dates=getSheetDates();const rows=[['区分','大項目','項目',...dates]];for(const g of sheetDraft.groups)for(const r of g.rows)rows.push([g.name,r.major||'',r.name,...dates.map(d=>calculate(r,d))]);const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${sheetDraft.name}_${sheetMonth}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();const code=$('loginCompany').value.trim(),id=$('loginId').value.trim(),pw=$('loginPassword').value;let found=null;if(code==='admin'&&id==='admin'&&pw==='admin')found={admin:true,id:'admin'};else{const c=companyUsers().find(c=>c.companyCode===code&&c.loginId===id&&c.password===pw);if(c)found={...c,admin:false}}if(!found){$('loginError').textContent='会社コード・ログインID・パスワードを確認してください。';return}user=found;expandedCompanies.clear();selectedCaseId=null;page=user.admin?'dashboard':'mycases';$('loginError').textContent='';$('loginForm').reset();showApp()});
$('logoutBtn').addEventListener('click',()=>{if(page==='sheet'&&!askLeaveSheet())return;user=null;editCompany=null;editCase=null;selectedCaseId=null;expandedCompanies.clear();$('appScreen').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('loginError').textContent=''});
</script></body></html>
